{% extends 'base.html' %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <title>Contact Page</title>
    <link rel="stylesheet" href="static/css/ContactPage.css" type = "text/css"/>
    <!-- Add Specific Font Later (CHECKED) -->
    <link href="https://fonts.googleapis.com/css2?family=Varela&display=swap" rel="stylesheet">

</head>
<body>
<div class="container">
    <h1>Have questions? Connect with us!</h1>
    <!-- <p>Test Test Test Test</p> -->
    <div class="contact-box">
        <div class="contact-left">
            <h3>Send your request</h3>
            <form action="/content/Contact/" method="POST">
                <div class="form-row">
					<!-- Input Message Box for email-->
                    <div class="form-group col-md-6">
                        <label for="inputEmail">Email</label>
                        <input type="email" class="form-control" name="inputEmail" placeholder="Email">
                    </div>
					<!-- Input Message Box for name-->
                    <div class="form-group col-md-6">
                        <label for="inputName">Full Name</label>
                        <input type="text" class="form-control" name="inputName" placeholder="Name">
                    </div>
					<!-- Input Message Box for phone number-->
					<div class="form-group col-md-6">
                    	<label for="inputPhoneNumber">Phone Number</label>
                    	<input type="text" class="form-control" name="inputPhoneNumber" placeholder="123-456-7890">
                	</div>
					<!-- Input Message Box for email subject-->
					<div class="form-group col-md-6">
                    	<label for="inputSubject">Subject</label>
                    	<input type="text" class="form-control" name="inputSubject" placeholder=" Subject">
                	</div>
					<br>
					<!-- Input Message Box for brief message-->
					<div class="form-group col-md-6">
                        <textarea rows="10" cols="85" name="inputMessage" placeholder="Message"></textarea>
                    </div>
					<br>
                </div>
                <button type="submit" class="button" >Send</button>
            </form>
            <!-- Bootstrap Form-->
        </div>
    </div>
</div>
</body>
</html>

{% endblock %}
